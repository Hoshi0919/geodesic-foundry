[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesic-foundry"
version = "1.0.0"
description = "Curved Spacetime Logistics & Penrose Ergosphere Accelerator: A Relativistic Foundry Simulator"
authors = [{ name = "Hoshi", email = "hoshi0919@outlook.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
